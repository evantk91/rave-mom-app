<!DOCTYPE html>
<html lang="en">
<head>
    <script src="./js/session-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/shared.css">
    <link rel="stylesheet" href="./css/game.css">
    <link rel="shortcut icon" type="image/png" href="assets/icons/favicon.png"/>
    <script src="./js/dashboard.js" defer></script>
    <title>Rave Mom</title>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.16.2/dist/phaser.min.js"></script>
    <script src="./js/startmenu.js"></script>
    <script src="./js/gamescene.js"></script>
    <script src="./js/game.js"></script>
    <section id="game-container">
        <div id="dashboard" class="panel">
            <h1 id="welcome-message"></h1>
            <div class="rule-container">
                <h3 class="rules">You are your squad's only hope! They need water!</h3>
            </div>
            <div class="rule-container">
                <h3 class="rules">Feed your friends water to score points.</h3>
            </div>
            <div class="rule-container">
                <h3 class="rules">Avoid the lasers or you will be knocked out by the bass!</h3>
            </div>
            <div class="button-container">
                <button class="button" id="user-logout">Log Out</button>
            </div>
            <div class="button-container">
                <button class="button" id="leaderboard-button">Leaderboard</button>
            </div>
        </div>
        <div id="canvas-container">
        </div>
    </section>
</body>
</html>
